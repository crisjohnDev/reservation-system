
{% extends "base.html" %}

{% block content %}

<style>

    .delete-page {
        min-height: calc(100vh - 70px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px;
    }

    .delete-card {
        width: 100%;
        max-width: 440px;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 30px;
        text-align: center;
    }

    .delete-icon {
        width: 52px;
        height: 52px;
        margin: 0 auto 18px;
        border-radius: 12px;
        background: #fef2f2;
        color: #dc2626;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
    }

    .delete-card h1 {
        font-size: 19px;
        color: #0f172a;
        margin-bottom: 8px;
    }

    .delete-card p {
        font-size: 13px;
        color: #64748b;
        line-height: 1.6;
    }

    .room-name {
        font-weight: 700;
        color: #0f172a;
    }

    .delete-actions {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-top: 25px;
    }

    .button {
        height: 40px;
        padding: 0 18px;
        border-radius: 8px;
        border: none;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
    }

    .cancel-button {
        background: #f1f5f9;
        color: #475569;
    }

    .delete-button {
        background: #dc2626;
        color: #ffffff;
    }

    .delete-button:hover {
        background: #b91c1c;
    }

    @media (max-width: 500px) {

        .delete-actions {
            flex-direction: column;
        }

        .button {
            width: 100%;
        }
    }

</style>


<div class="delete-page">

    <div class="delete-card">

        <div class="delete-icon">
            ×
        </div>

        <h1>
            Delete Room / Cottage?
        </h1>

        <p>
            Are you sure you want to delete
            <span class="room-name">
                {{ room.name }}
            </span>?
            This action cannot be undone.
        </p>


        <form
            method="POST"
            class="delete-actions"
        >

            {% csrf_token %}

            <a
                href="{% url 'rooms' %}"
                class="button cancel-button"
            >
                Cancel
            </a>

            <button
                type="submit"
                class="button delete-button"
            >
                Yes, Delete
            </button>

        </form>

    </div>

</div>

{% endblock %}
